<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — Baiacuz</title>
<meta name="robots" content="noai, noimageai, noindex">
<link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,400&family=Jost:wght@300;400&family=Rubik+Puddles&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main class="nf">
  <span class="sparkle" style="top:22%;left:18%">✦</span>
  <span class="sparkle" style="top:60%;right:20%;animation-delay:1s">✦</span>
  <div>
    <img src="/img/mascote.png" alt="" onerror="this.onerror=null;this.src='/img/placeholder.svg'">
    <h1 class="chrome">404</h1>
    <p class="subtitle" id="msg">Ops… essa página se escondeu. ✦</p>
    <a class="btn btn-primary" href="/" id="back">Voltar ao início</a>
  </div>
</main>
<script>
  var l='pt';try{l=localStorage.getItem('bz_lang')||((navigator.language||'').toLowerCase().indexOf('pt')===0?'pt':'en')}catch(e){}
  if(l==='en'){document.documentElement.lang='en';document.getElementById('msg').textContent='Oops… this page is hiding. ✦';document.getElementById('back').textContent='Back home'}
</script>
</body>
</html>
